name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: bash scripts/build.sh --universal
      - uses: actions/upload-artifact@v4
        with:
          name: Pane-universal
          path: |
            dist/*.zip
            dist/*.sha256
